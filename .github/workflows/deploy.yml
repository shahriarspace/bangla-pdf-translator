# deploy.yml — Build Astro site and deploy to GitHub Pages
#
# Triggered by:
# - Push to main (manual deploys, catalog updates)
# - workflow_dispatch (triggered by translate.yml after translation)

name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'public/**'
      - 'library/**'
      - 'package.json'
      - 'astro.config.mjs'
  workflow_dispatch:

# Allow only one deployment at a time
concurrency:
  group: pages
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    name: Build Astro Site
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Copy library files to public directory
        run: |
          # Copy translated book files so Astro serves them as static assets.
          # This avoids committing duplicates in both library/ and public/library/.
          if [ -d "library" ]; then
            mkdir -p public/library
            # Copy all book directories (skip catalog.json — only needed at build time)
            for dir in library/*/; do
              if [ -d "$dir" ]; then
                slug=$(basename "$dir")
                mkdir -p "public/library/$slug"
                cp -r "$dir"* "public/library/$slug/" 2>/dev/null || true
              fi
            done
            echo "Copied library files to public/library/"
          fi

      - name: Build Astro site
        run: npm run build
        env:
          PUBLIC_TRIGGER_TOKEN: ${{ vars.PUBLIC_TRIGGER_TOKEN }}

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    name: Deploy to Pages
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
