# translate.yml — Triggered by workflow_dispatch from the web UI
#
# This workflow:
# 1. Downloads a Bangla PDF committed to uploads/{slug}/ in the repo
# 2. Conditionally installs dependencies based on chosen OCR/translation mode
# 3. Runs the translation pipeline (extract -> translate -> generate)
# 4. Commits results to library/{slug}/ and updates catalog.json
# 5. Cleans up the uploaded PDF from uploads/
# 6. Triggers the deploy workflow to rebuild the Astro site
#
# Dependency weight by mode:
#   AI OCR + AI translation (best quality): ~55 MB  (<1 min install)
#   Online translation (Google):            ~75 MB  (<1 min install)
#   Offline/hybrid translation (Argos):    ~700 MB  (~4 min install)

name: Translate Book

on:
  workflow_dispatch:
    inputs:
      pdf_filename:
        description: 'Original PDF filename'
        required: true
        type: string
      slug:
        description: 'Book slug (directory name in library/)'
        required: true
        type: string
      pdf_path:
        description: 'Path to PDF in repo (e.g. uploads/my-book/file.pdf)'
        required: true
        type: string
      translation_mode:
        description: 'Translation engine: offline (Argos), online (Google), hybrid, or ai (literary AI)'
        required: false
        default: 'ai'
        type: string
      ocr_engine:
        description: 'OCR engine: tesseract (offline) or ai (vision model)'
        required: false
        default: 'ai'
        type: string
      refinement_provider:
        description: 'AI refinement: none, github, or openai'
        required: false
        default: 'none'
        type: string
      refinement_model:
        description: 'AI model name override'
        required: false
        default: ''
        type: string
      ai_provider:
        description: 'AI pipeline provider: github or openai (for ocr_engine=ai or translation_mode=ai)'
        required: false
        default: 'github'
        type: string
      ai_ocr_model:
        description: 'AI OCR model (vision-capable, e.g. gpt-4o)'
        required: false
        default: 'gpt-4o'
        type: string
      ai_translate_model:
        description: 'AI translation model (e.g. gpt-4o)'
        required: false
        default: 'gpt-4o'
        type: string
      book_title:
        description: 'Book title (optional — extracted from PDF if not provided)'
        required: false
        default: ''
        type: string
      book_author:
        description: 'Book author (optional — extracted from PDF if not provided)'
        required: false
        default: ''
        type: string
      use_asciidoctor:
        description: 'Use Ruby asciidoctor for HTML/PDF (false = use Python fallback, lighter)'
        required: false
        default: 'false'
        type: string
      book_title_bn:
        description: 'Book title in Bangla (for bilingual JSON export)'
        required: false
        default: ''
        type: string
      book_author_bn:
        description: 'Book author in Bangla (for bilingual JSON export)'
        required: false
        default: ''
        type: string
      book_year:
        description: 'Book publication year (for bilingual JSON export)'
        required: false
        default: ''
        type: string
      book_category:
        description: 'Book category (for bilingual JSON export, default: Novel)'
        required: false
        default: 'Novel'
        type: string

permissions:
  contents: write
  actions: write

jobs:
  translate:
    name: Translate PDF
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Show configuration
        run: |
          echo "=== Translation Configuration ==="
          echo "OCR Engine:         ${{ inputs.ocr_engine }}"
          echo "Translation Mode:   ${{ inputs.translation_mode }}"
          echo "AI Provider:        ${{ inputs.ai_provider }}"
          echo "Refinement:         ${{ inputs.refinement_provider }}"
          echo "Use Asciidoctor:    ${{ inputs.use_asciidoctor }}"
          echo "================================="

      # --- Conditional: Tesseract (only for tesseract OCR) ---
      - name: Install Tesseract OCR
        if: inputs.ocr_engine == 'tesseract'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            tesseract-ocr \
            tesseract-ocr-ben \
            tesseract-ocr-eng
          tesseract --version
          tesseract --list-langs

      # --- Conditional: Ruby + Asciidoctor (only when explicitly requested) ---
      - name: Install Ruby and Asciidoctor
        if: inputs.use_asciidoctor == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ruby
          sudo gem install asciidoctor asciidoctor-pdf --no-document
          asciidoctor --version

      # --- Always: Base Python dependencies ---
      - name: Install base Python dependencies
        run: pip install -r backend/requirements-base.txt

      # --- Conditional: PyTorch + Argos (only for offline/hybrid translation) ---
      - name: Install CPU-only PyTorch
        if: inputs.translation_mode == 'offline' || inputs.translation_mode == 'hybrid'
        run: pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Install Argos Translate
        if: inputs.translation_mode == 'offline' || inputs.translation_mode == 'hybrid'
        run: pip install -r backend/requirements-offline.txt

      - name: Download and install Argos Translate model
        if: inputs.translation_mode == 'offline' || inputs.translation_mode == 'hybrid'
        run: |
          python -c "
          import argostranslate.package
          argostranslate.package.update_package_index()
          pkgs = argostranslate.package.get_available_packages()
          bn_en = next(p for p in pkgs if p.from_code == 'bn' and p.to_code == 'en')
          argostranslate.package.install_from_path(bn_en.download())
          print('Argos bn->en model installed')
          "

      - name: Run translation pipeline
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          AI_PROVIDER: ${{ inputs.ai_provider }}
          AI_OCR_MODEL: ${{ inputs.ai_ocr_model }}
          AI_TRANSLATE_MODEL: ${{ inputs.ai_translate_model }}
        run: |
          python backend/translate_book.py \
            --slug "${{ inputs.slug }}" \
            --pdf-path "${{ inputs.pdf_path }}" \
            --filename "${{ inputs.pdf_filename }}" \
            --mode "${{ inputs.translation_mode }}" \
            --ocr-engine "${{ inputs.ocr_engine }}" \
            --refinement "${{ inputs.refinement_provider }}" \
            --model "${{ inputs.refinement_model }}" \
            --book-title "${{ inputs.book_title }}" \
            --book-author "${{ inputs.book_author }}" \
            --book-title-bn "${{ inputs.book_title_bn }}" \
            --book-author-bn "${{ inputs.book_author_bn }}" \
            --book-year "${{ inputs.book_year }}" \
            --book-category "${{ inputs.book_category }}"

      - name: Upload bilingual JSON as artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: bilingual-json-${{ inputs.slug }}
          path: library/${{ inputs.slug }}/${{ inputs.slug }}.json
          if-no-files-found: ignore
          retention-days: 90

      - name: Commit results to repository
        env:
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: github-actions[bot]@users.noreply.github.com
        run: |
          SLUG="${{ inputs.slug }}"
          BOOK_DIR="library/${SLUG}"

          # Remove the uploaded PDF (no longer needed)
          git rm -rf "uploads/${SLUG}/" || true
          git add "${BOOK_DIR}/" "library/catalog.json"
          git commit -m "Add translated book: ${SLUG}"

          # Push with retry logic for concurrent translations.
          # Strategy: on conflict, abort rebase, fetch latest, build a fresh
          # merge commit that combines our book files with the remote catalog.
          MAX_RETRIES=5
          for i in $(seq 1 $MAX_RETRIES); do
            if git push origin main; then
              echo "Push succeeded on attempt $i"
              break
            fi

            echo "Push failed (attempt $i/$MAX_RETRIES), resolving..."

            # Clean up any in-progress rebase from a previous attempt
            git rebase --abort 2>/dev/null || true

            # Make sure we're on main (not detached HEAD)
            git checkout main 2>/dev/null || true

            # Save our catalog entry and book files
            cp library/catalog.json /tmp/our_catalog.json

            # Fetch latest remote state
            git fetch origin main

            # Reset to remote HEAD (keeps our book files in the working tree)
            git reset --soft origin/main

            # The book files are still staged from our commit.
            # Re-stage everything to be safe.
            git checkout HEAD -- library/catalog.json 2>/dev/null || true
            git add "${BOOK_DIR}/" || true

            # Merge catalog.json: start from remote version, add our book entry
            python3 -c "
          import json
          from pathlib import Path

          # Load the remote catalog (current HEAD after reset)
          remote_catalog = json.loads(Path('library/catalog.json').read_text())

          # Load our catalog (saved before reset)
          our_catalog = json.loads(Path('/tmp/our_catalog.json').read_text())

          # Find our book entry
          our_entry = next((b for b in our_catalog['books'] if b['slug'] == '${SLUG}'), None)

          if our_entry:
              # Remove any existing entry for this slug in remote catalog
              remote_catalog['books'] = [b for b in remote_catalog['books'] if b['slug'] != '${SLUG}']
              # Insert our entry at the front (newest first)
              remote_catalog['books'].insert(0, our_entry)

          Path('library/catalog.json').write_text(
              json.dumps(remote_catalog, indent=2, ensure_ascii=False) + '\n'
          )
          "

            git add library/catalog.json
            git commit -m "Add translated book: ${SLUG}"

            if [ "$i" -eq "$MAX_RETRIES" ]; then
              echo "Failed to push after $MAX_RETRIES attempts"
              exit 1
            fi

            # Small delay to avoid rapid-fire conflicts with other workflows
            sleep 2
          done

      - name: Trigger site rebuild
        if: success()
        run: |
          curl -s -X POST \
            -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github.v3+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/deploy.yml/dispatches" \
            -d '{"ref":"main"}'
