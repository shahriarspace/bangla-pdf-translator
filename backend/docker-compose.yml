services:
  web:
    build: .
    image: bangla-pdf-to-eng:latest
    container_name: bangla-translator-web
    ports:
      - "8501:8000"
    volumes:
      # Persist jobs data between restarts
      - ./jobs:/app/jobs
    env_file:
      - path: ./.env
        required: false
    environment:
      - OCR_ENGINE=tesseract
      - TESSERACT_PATH=/usr/bin/tesseract
      # AI pipeline (set GITHUB_TOKEN or OPENAI_API_KEY in .env to enable)
      # - AI_PROVIDER=github
      # - AI_OCR_MODEL=gpt-4o
      # - AI_TRANSLATE_MODEL=gpt-4o
    restart: unless-stopped
